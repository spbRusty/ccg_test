name: Update Hearthstone card catalog

on:
  push:
    paths:
      - ".github/workflows/update-hearthstone-cards.yml"
      - "scripts/update_hearthstone_cards.py"
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download and export all cards
        run: python scripts/update_hearthstone_cards.py
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- cards.csv; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.csv
          git commit -m "Update Hearthstone card catalog"
          git push
