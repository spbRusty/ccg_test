name: Update Marvel SNAP card catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    paths-ignore:
      - "marvel_snap_cards.csv"
      - "data/marvel_snap_translation_cache.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and translate all card records
        run: python scripts/update_marvel_snap_cards.py
      - name: Commit catalog
        run: |
          if git diff --quiet -- marvel_snap_cards.csv data/marvel_snap_translation_cache.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marvel_snap_cards.csv data/marvel_snap_translation_cache.json
          git commit -m "Update Russian Marvel SNAP card catalog"
          git push
